name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/start-app

      # Smoke runs first as a quick gate: if the critical path is broken, regression is skipped.
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          PW_HTML_REPORT: reports/smoke-html
          PW_JSON_REPORT: reports/smoke.json

      - name: Run regression tests
        run: npm run test:regression
        env:
          PW_HTML_REPORT: reports/regression-html
          PW_JSON_REPORT: reports/regression.json

      # Quarantined tests still run so their state stays visible, but they never block a merge.
      - name: Run quarantined tests (non-blocking)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run test:quarantine
        env:
          PW_HTML_REPORT: reports/quarantine-html
          PW_JSON_REPORT: reports/quarantine.json

      - name: Write job summary
        if: always()
        run: >
          node scripts/ci-summary.mjs
          Smoke=reports/smoke.json Regression=reports/regression.json
          Quarantine=reports/quarantine.json

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports
          path: reports/*-html/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Application logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop application
        if: always()
        run: npm run env:down
