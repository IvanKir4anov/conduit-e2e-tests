server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same-origin API: the browser calls /api/*, nginx forwards it unchanged to the backend.
  # Docker's DNS, re-resolved every 10s: a restarted backend container gets a new IP, and a
  # variable in proxy_pass makes nginx look it up again instead of caching it at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
